<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Programs</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #FAF8F5;
            --card-bg: #FFFFFF;
            --text-main: #2C2C2C;
            --text-muted: #666666;
            --mustard: #D4A373;
            --mustard-dark: #BC6C25;
            --mustard-light: #FAEDCD;
            --border-color: #E6DFD5;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: var(--mustard-dark);
            background-color: var(--mustard-light);
            padding: 6px 16px;
            border-radius: 8px;
            letter-spacing: 0.5px;
        }

        .student-intro {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            background: var(--bg-color);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .container {
            max-width: 1300px;
            margin: 40px auto;
            padding: 0 20px;
            flex: 1;
            width: 100%;
        }

        .page-title {
            margin-bottom: 30px;
            font-size: 24px;
            font-weight: 600;
            color: var(--text-main);
        }

        .topics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 25px;
        }

        .topic-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topic-card:hover {
            transform: translateY(-4px);
            border-color: var(--mustard);
            box-shadow: 0 8px 25px rgba(212, 163, 115, 0.15);
        }

        .topic-info h3 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .topic-info p {
            font-size: 13px;
            color: var(--text-muted);
        }

        .arrow-icon {
            font-size: 18px;
            color: var(--mustard-dark);
            background-color: var(--mustard-light);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #question-view {
            display: none;
        }

        .back-btn {
            background: var(--mustard-light);
            border: 1px solid var(--mustard);
            color: var(--mustard-dark);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            background: var(--mustard);
            color: white;
        }

        .split-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 25px;
            align-items: start;
        }

        @media (max-width: 900px) {
            .split-layout {
                grid-template-columns: 1fr;
            }
            .topics-grid {
                grid-template-columns: 1fr;
            }
        }

        .questions-sidebar {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 20px;
            max-height: 75vh;
            overflow-y: auto;
            box-shadow: var(--shadow);
        }

        .sidebar-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .question-list-item {
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .question-list-item:hover {
            background-color: var(--mustard-light);
            color: var(--mustard-dark);
        }

        .question-list-item.active {
            background-color: var(--mustard-light);
            border-color: var(--mustard);
            color: var(--mustard-dark);
            font-weight: 600;
        }

        .content-display-pane {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 30px;
            box-shadow: var(--shadow);
            min-height: 75vh;
        }

        .q-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .q-title span {
            color: var(--mustard-dark);
        }

        .code-output-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 15px;
        }

        .box-section h4 {
            font-size: 13px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        pre {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            overflow-x: auto;
            line-height: 1.5;
            border-left: 4px solid var(--mustard);
        }

        .output-box {
            background: #252526;
            color: #4ec9b0;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            white-space: pre-wrap;
            border-left: 4px solid #4ec9b0;
            min-height: 60px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo">JAVA PROGRAMS</div>
            <div class="student-intro">Janvi Arya | 7010/24</div>
        </div>
    </header>

    <div class="container">

        <div id="question-view">

            <div class="split-layout">
                <div class="questions-sidebar" id="questionsSidebar">
                    <div class="sidebar-title">Questions</div>
                    <div id="sidebarList"></div>
                </div>

                <div class="content-display-pane" id="contentDisplayPane">
                    <div id="activeQuestionContent"></div>
                </div>
            </div>
        </div>
    </div>

        function renderTopics() {
            const grid = document.getElementById('topicsGrid');
            grid.innerHTML = '';
            
            for (const topic in data) {
                const count = data[topic].length;
                const card = document.createElement('div');
                card.className = 'topic-card';
                card.onclick = () => openTopic(topic);
                card.innerHTML = `
                    <div class="topic-info">
                        <h3>${topic}</h3>
                        <p>${count} practice problems</p>
                    </div>
                    <div class="arrow-icon">
                        <i class="fas fa-chevron-right"></i>
                    </div>
                `;
                grid.appendChild(card);
            }
        }

        function openTopic(topicName) {
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('question-view').style.display = 'block';
            document.getElementById('selectedTopicTitle').innerText = topicName;
            
            const sidebarList = document.getElementById('sidebarList');
            sidebarList.innerHTML = '';
            
            const questions = data[topicName];
            
            questions.forEach((q, index) => {
                const item = document.createElement('div');
                item.className = 'question-list-item';
                if(index === 0) item.classList.add('active');
                item.innerText = `Q${index + 1}: ${q.title}`;
                item.onclick = () => selectQuestion(topicName, index, item);
                sidebarList.appendChild(item);
            });
            
            if(questions.length > 0) {
                displayQuestion(questions[0], 0);
            }
            window.scrollTo(0, 0);
        }

        function selectQuestion(topicName, index, element) {
            document.querySelectorAll('.question-list-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            
            const q = data[topicName][index];
            displayQuestion(q, index);
        }

        function displayQuestion(q, index) {
            const pane = document.getElementById('activeQuestionContent');
            pane.innerHTML = `
                <div class="q-title">
                    <span>Q${index + 1}.</span>
                    <div>${q.title}</div>
                </div>
                <div class="code-output-container">
                    <div class="box-section" style="margin-bottom: 20px;">
                        <h4>Java Code Solution</h4>
                        <pre><code>${escapeHtml(q.code)}</code></pre>
                    </div>
                    <div class="box-section">
                        <h4>Program Output</h4>
                        <div class="output-box">${escapeHtml(q.output)}</div>
                    </div>
                </div>
            `;
        }

        function showHome() {
            document.getElementById('question-view').style.display = 'none';
            document.getElementById('home-view').style.display = 'block';
            window.scrollTo(0, 0);
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        renderTopics();
    </script>
